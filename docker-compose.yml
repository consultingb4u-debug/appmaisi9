# Uso: cp .env.example .env (preencher) && docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: maisi9
      POSTGRES_USER: maisi9
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maisi9}
    volumes:
      - dados_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maisi9 -d maisi9"]
      interval: 5s
      retries: 10

  migrador:
    build: { context: ., target: migrador }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://maisi9:${POSTGRES_PASSWORD:-maisi9}@db:5432/maisi9?schema=public
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: app }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://maisi9:${POSTGRES_PASSWORD:-maisi9}@db:5432/maisi9?schema=public
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - arquivos:/app/storage # planilhas importadas e, depois, documentos
    depends_on:
      migrador: { condition: service_completed_successfully }

  # Agendador: dispara a rotina de alertas por e-mail nos dias úteis às 7h (horário de Brasília).
  agendador:
    image: alpine:3.20
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    command: >
      sh -c 'apk add --no-cache curl tzdata >/dev/null &&
      echo "0 7 * * 1-5 curl -fsS -X POST -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/tarefas/alertas" | crontab - &&
      crond -f -l 8'
    depends_on: [app]

volumes:
  dados_db:
  arquivos:
